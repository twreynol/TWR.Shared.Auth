name: Publish TWR.Shared.Auth to GitHub Packages

# Publishes automatically on every push to master, IF <Version> in
# TWR.Shared.Auth.csproj is newer than the last published tag — no manual
# "git tag" step needed. Bump <Version> in the csproj before merging dev -> master
# and the merge itself triggers pack + publish + tag.

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  publish:
    name: Pack and push TWR.Shared.Auth
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from csproj
        id: version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' TWR.Shared.Auth.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if this version is already published (tagged)
        id: check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.version.outputs.version }}$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore (needs the GitHub Packages feed for TWR.MyFamilyAuth.Contracts)
        if: steps.check.outputs.exists == 'false'
        run: dotnet restore TWR.Shared.Auth.csproj
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Pack
        if: steps.check.outputs.exists == 'false'
        run: dotnet pack TWR.Shared.Auth.csproj -c Release -o ./nupkg --no-restore

      - name: Push to GitHub Packages
        if: steps.check.outputs.exists == 'false'
        run: dotnet nuget push "./nupkg/*.nupkg" --source "https://nuget.pkg.github.com/twreynol/index.json" --api-key ${{ secrets.GH_PACKAGES_TOKEN }} --skip-duplicate

      - name: Tag this version
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
